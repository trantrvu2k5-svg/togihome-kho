name = "togihome-keo-lead"
main = "src/index.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "1feb21b95d0840859d902e6d4b142f60"

# [L-70r9] CEO đã nâng Workers Paid. cpu_ms = TRẦN AN TOÀN, KHÔNG phải mục tiêu — lượt lành phải xong
#   dưới 1 GIÂY CPU (r8 gộp lô đã đạt cả dưới Free 10ms). Đặt 30s để lượt BẤT THƯỜNG bị cắt sớm thay vì
#   âm thầm nuốt tiền. Gói Paid là CHỖ DƯ, không phải chỗ dựa để nới ẩu.
[limits]
cpu_ms = 30000

# [WP-91 L-91.3] Hai cron TRÊN CÙNG worker (không đẻ worker/cơ chế thứ hai):
#   "* * * * *" = kéo LEAD mỗi phút (cũ). "0 19 * * *" = kéo CHI ADS 1 lần/ngày (19:00 UTC = 02:00 VN, off-peak).
#   scheduled() rẽ theo event.cron. Ads cần secret META_CAPI_TOKEN (wrangler secret put) TRƯỚC khi deploy.
[triggers]
crons = ["* * * * *", "0 19 * * *"]
