@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
.ca{
 --bg:#EEF1F7; --surface:#fff; --raise:#F8F9FC;
 --bd:#E4E8F0; --bd2:#EFF2F7; --bdS:#D3D9E4;
 --tx:#151B2C; --tx2:#3B4356; --mut:#6B7488; --fnt:#98A1B3;

 --l0:#C8202E; --l0B:#FCECEE; --l1:#E8890C; --l1B:#FDF2E3; --l2:#7B4FE0; --l2B:#F0EBFD; --l3:#12A6A6; --l3B:#E4F6F6;
